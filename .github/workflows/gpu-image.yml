# Builds the machine image HuggingFound rents at RunPod and publishes it to
# the GitHub Container Registry as ghcr.io/hungatejoseph/huggingfound-gpu.
# Runs when anything under gpu/ changes, and by hand from the Actions tab.
# The package has to be made public once, in the package's settings on
# GitHub, for RunPod to pull it without credentials (DEPLOY.md).
name: GPU machine image

on:
  push:
    branches: [main]
    paths: ["gpu/**", "src/convert.js", ".github/workflows/gpu-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The CUDA toolkit image and the compile need room the runner's
      # preinstalled toolchains take up.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu/Dockerfile
          push: true
          # Registry names are lowercase, whatever the account's spelling.
          tags: |
            ghcr.io/hungatejoseph/huggingfound-gpu:latest
            ghcr.io/hungatejoseph/huggingfound-gpu:${{ github.sha }}
          # The compiled stage is too big for the Actions cache; the registry keeps it.
          cache-from: type=registry,ref=ghcr.io/hungatejoseph/huggingfound-gpu:buildcache
          cache-to: type=registry,ref=ghcr.io/hungatejoseph/huggingfound-gpu:buildcache,mode=max
