# Render deployment ("Blueprint") for the hosted copy of HuggingFound. The
# service is defined here, in the repository, rather than clicked into a
# dashboard. Keys are marked `sync: false`, so Render asks for them and keeps
# them encrypted; all of them are optional.

services:
  - type: web
    name: huggingfound
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # the free plan has no disk and sleeps between visits
    region: oregon # or frankfurt, singapore, ohio, whichever is closer
    healthCheckPath: /

    # The scan of Hugging Face and what people say about each model live
    # here, so a redeploy keeps the catalogue instead of rebuilding it.
    disk:
      name: huggingfound-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # --- Optional keys: Render prompts for these -----------------------
      - key: HF_TOKEN # a Hugging Face read token; raises the Hub's rate limit
        sync: false
      - key: GITHUB_TOKEN # thirty GitHub searches a minute instead of ten
        sync: false
      - key: YOUTUBE_API_KEY # video reviews; without it YouTube is skipped
        sync: false
      # The Claude check: visitors bring their own Anthropic key; the key
      # here is the owner's and answers only to the dev code. Set both or
      # neither. Pick a long random dev code and keep it private.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REVIEW_DEV_CODE
        sync: false
      # Sign in with Google, for accounts that keep a visitor's own keys and
      # their rented GPU. The client id comes from a Google Cloud OAuth
      # client whose authorised JavaScript origins are the site's addresses
      # (DEPLOY.md, phase 5). Blank means nobody can sign in.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # --- Generated once by Render, then kept stable ----------------------
      # SESSION_SECRET signs the sign-in cookie; changing it signs everyone
      # out. ACCOUNTS_SECRET encrypts the keys in the account files; changing
      # it makes every saved key unreadable, so let Render own both.
      - key: SESSION_SECRET
        generateValue: true
      - key: ACCOUNTS_SECRET
        generateValue: true

      # --- Fixed values ----------------------------------------------------
      - key: HUGGINGFOUND_HOSTED
        value: "1"
      - key: HUGGINGFOUND_HOME
        value: /var/data
      - key: HUGGINGFOUND_REFRESH_HOURS # how often the catalogue is rescanned
        value: "12"
      - key: PORT
        value: "4188"
      - key: SITE_ORIGIN # the address a rented GPU's Ollama accepts browser requests from
        value: https://huggingfound.com
